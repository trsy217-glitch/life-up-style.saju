<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<style>
/* ── OG 이미지 1200×630 ──
   카카오톡·페이스북 미리보기는 가로 폭이 좁은 자리에서 잘리기도 한다.
   그래서 글자는 가운데 쪽으로 모으고, 가장자리 60px 안에는 중요한 것을 두지 않는다. */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --paper:#FAF6ED; --paper-up:#FFFDF8; --rule:#D9CDB4; --rule-soft:#E7DFCD;
  --ink:#2E2A22; --ink-2:#5C564A; --ink-3:#8A8273;
  --gold:#9A7B3F; --gold-soft:#C6AC74;
  --mok:#2E7D6E; --hwa:#B23A32; --to:#B07F1C; --geum:#6E7681; --su:#3F5490;
  --mun:"Noto Serif CJK KR",serif;
}
html,body{width:1200px;height:630px}
body{background:var(--paper);font-family:var(--mun);overflow:hidden;position:relative}

/* 한지 결 — 아주 옅은 사선 */
body::before{content:"";position:absolute;inset:0;opacity:.5;
 background:
   radial-gradient(130% 100% at 50% -10%,#FFFEFA 0%,rgba(255,254,250,0) 62%),
   repeating-linear-gradient(126deg,rgba(154,123,63,.045) 0 1px,rgba(154,123,63,0) 1px 7px)}

/* 금색 두 줄 테두리 */
.frame{position:absolute;inset:26px;border:2px solid var(--gold-soft)}
.frame::after{content:"";position:absolute;inset:7px;border:1px solid var(--rule)}
/* 네 모서리 금구슬 */
.bead{position:absolute;width:13px;height:13px;border-radius:50%;
 background:linear-gradient(180deg,#F8E8BE,#B8903C);box-shadow:0 0 0 3px var(--paper)}
.b1{left:19px;top:19px} .b2{right:19px;top:19px}
.b3{left:19px;bottom:19px} .b4{right:19px;bottom:19px}

.wrap{position:absolute;inset:0;display:flex;align-items:center;
 padding:0 80px;gap:52px}

/* ── 왼쪽: 이름과 한 줄 ── */
.left{flex:1;min-width:0}
.mark{font-weight:900;font-size:20px;letter-spacing:.3em;color:var(--gold);
 margin-bottom:26px}
h1{font-weight:900;font-size:63px;line-height:1.26;letter-spacing:-.035em;color:var(--ink);
 word-break:keep-all}
h1 em{font-style:normal;color:var(--gold);}
.en{margin-top:20px;font-size:23px;font-style:italic;color:var(--gold-soft);letter-spacing:.04em}
.rule{width:88px;height:2px;background:var(--gold-soft);margin:30px 0 22px}
.menu{font-size:19.5px;color:var(--ink-2);letter-spacing:-.01em;line-height:1.75}
.menu b{color:var(--ink);font-weight:700}

/* ── 오른쪽: 만세력 여덟 글자 ── */
.plate{flex:none;width:404px;background:var(--paper-up);border:1px solid var(--rule);
 border-radius:5px;padding:22px 20px 18px;box-shadow:0 3px 16px -8px rgba(46,42,34,.3)}
.ph{display:flex;gap:10px;margin-bottom:9px}
.ph span{flex:1;text-align:center;font-size:15px;font-weight:700;color:var(--ink-3);letter-spacing:.08em}
.grid{display:flex;gap:10px}
.col{flex:1;display:flex;flex-direction:column;gap:10px}
.cell{height:84px;border-radius:4px;display:flex;align-items:center;justify-content:center;
 font-size:43px;font-weight:700;color:#fff;position:relative;
 box-shadow:inset 0 0 0 1px rgba(255,255,255,.22), 0 2px 7px -3px rgba(46,42,34,.38)}
.cell small{position:absolute;right:7px;bottom:5px;font-size:12px;font-weight:700;opacity:.82;letter-spacing:0}
.mok{background:var(--mok)} .hwa{background:var(--hwa)} .to{background:var(--to)}
.geum{background:var(--geum)} .su{background:var(--su)}
.cap{margin-top:15px;padding-top:13px;border-top:1px solid var(--rule-soft);text-align:center;font-size:15.5px;color:var(--ink-3);letter-spacing:-.01em}

</style></head>
<body>
<div class="frame"></div>
<i class="bead b1"></i><i class="bead b2"></i><i class="bead b3"></i><i class="bead b4"></i>

<div class="wrap">
  <div class="left">
    <p class="mark">LIFE-UP STYLE</p>
    <h1>잘사는 사주로<br><em>업그레이드</em>하는 앱</h1>
    <p class="en">Style up life app</p>
    <div class="rule"></div>
    <p class="menu"><b>만세력</b> · <b>신년운세</b> · 금전 · 연애 · 사업 · 직업<br>
      그리고 <b>연인궁합</b>과 <b>비즈니스궁합</b></p>
  </div>

  <div class="plate">
    <div class="ph"><span>時</span><span>日</span><span>月</span><span>年</span></div>
    <div class="grid">
      <div class="col"><div class="cell geum">辛<small>금</small></div><div class="cell su">亥<small>수</small></div></div>
      <div class="col"><div class="cell hwa">丁<small>화</small></div><div class="cell to">丑<small>토</small></div></div>
      <div class="col"><div class="cell su">壬<small>수</small></div><div class="cell hwa">午<small>화</small></div></div>
      <div class="col"><div class="cell mok">乙<small>목</small></div><div class="cell to">丑<small>토</small></div></div>
    </div>
    <p class="cap">절기와 진태양시까지 되짚어 세운 여덟 글자</p>
  </div>
</div>

</body></html>
